name: TC03_iq_sensor_offset
description: Fault injection - 20 A offset on measured iq at 0.7 s under 50 Nm load.
t_stop: 1.0
inputs:
  w_ref: {type: step, time: 0.01, final: 50}
  TL: {type: step, time: 0.5, final: 50}
  iq_offset: {type: step, time: 0.7, final: 20}

checks:
  requirements:
    - {name: fault_dip, metric: max_dip, signal: wm, target: 50, t_start: 0.7, max: 1.0, unit: rad/s}
    - {name: fault_recovery, metric: settling_time, signal: wm, target: 50, t_start: 0.7, tol: 0.005, max: 0.2, unit: s}
    - {name: current_limit, metric: max, signal: iq, max: 255, unit: A}
  baseline:
    - {signal: wm, max_dev: 0.5, rms: 0.1}
    - {signal: iq, max_dev: 5.0, rms: 1.0}
    - {signal: iq_ref, max_dev: 5.0, rms: 1.0}